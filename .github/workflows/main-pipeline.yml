name: Main Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests & build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Firebase credentials
        run: echo "$FIREBASE_CREDENTIALS_JSON" | base64 --decode > backend/src/main/resources/firebase-adminsdk.json
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      # JaCoCo report goal is bound to the test phase in pom.xml
      - name: Run unit tests
        working-directory: backend
        run: ./mvnw test

      - name: Coverage summary
        if: always()
        run: |
          CSV=backend/target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "No JaCoCo report found." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          awk -F, 'NR>1 { missed+=$8; covered+=$9 } END {
            total = missed + covered
            pct = total ? covered * 100 / total : 0
            printf "### Backend line coverage: %.1f%% (%d/%d lines)\n", pct, covered, total
          }' "$CSV" >> $GITHUB_STEP_SUMMARY

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 30

      - name: Build backend jar
        working-directory: backend
        run: ./mvnw package -DskipTests

  webapp:
    name: Webapp lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Lint webapp
        working-directory: webapp
        run: npm run lint

      - name: Type-check and build webapp
        working-directory: webapp
        run: npm run build

      - name: Upload webapp build
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: webapp/dist/
          retention-days: 14

  android:
    name: Build Android APK
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the nightly GitHub Release

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Make Gradle wrapper executable
        run: chmod +x mobile/android/gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > mobile/android/app/fitlink.keystore

      - name: Set up google-services.json
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > mobile/android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Create .env.production
        working-directory: mobile
        run: echo "API_URL=${{ secrets.API_URL }}" > .env.production

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease
        env:
          MYAPP_UPLOAD_STORE_FILE: fitlink.keystore
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitlink-release
          path: mobile/android/app/build/outputs/apk/release/*.apk

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Create or update release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: nightly
          name: "Latest Build (${{ steps.date.outputs.date }})"
          body: "Automated build from commit ${{ github.sha }}"
          files: mobile/android/app/build/outputs/apk/release/*.apk
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
